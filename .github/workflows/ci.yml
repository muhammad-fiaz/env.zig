name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test (Zig 0.17.0, ${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        optimize: ['Debug', 'ReleaseFast']
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'

      - name: Build (${{ matrix.optimize }})
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Test (${{ matrix.optimize }})
        run: zig build test --summary all -Doptimize=${{ matrix.optimize }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'

      - name: Check formatting
        run: zig fmt --check .

      - name: Build docs
        run: zig build docs

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'

      - name: Run all examples
        run: zig build example

  cross:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ['aarch64-linux', 'x86_64-windows', 'aarch64-macos', 'x86-windows', 'x86-linux']
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'

      - name: Build for ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }}
