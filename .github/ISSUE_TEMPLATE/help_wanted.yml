name: Help Wanted
description: Ask for help with using env.zig
labels: ['question', 'help wanted']
body:
  - type: markdown
    attributes:
      value: |
        Need help with env.zig? Please describe your question.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any relevant code snippets, error messages, or configuration

  - type: input
    id: version
    attributes:
      label: env.zig Version
      placeholder: "0.0.1"

  - type: input
    id: zig-version
    attributes:
      label: Zig Version
      placeholder: "0.16.0"
